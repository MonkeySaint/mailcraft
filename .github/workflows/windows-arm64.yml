# Windows on Arm build on demand: cross-compiles aarch64-pc-windows-msvc on the x64 windows-latest runner
# (its Visual Studio has the MSVC ARM64 build tools, and LLVM/clang for the ring crate), or builds natively
# on the windows-11-arm runner. Produces mailcraft-VERSION-windows-aarch64.msi and .zip, signed when
# WINDOWS_CERT_PFX / WINDOWS_CERT_PASSWORD are set.
name: windows-arm64

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner (windows-latest cross-compiles, windows-11-arm builds natively)
        type: choice
        options: [windows-latest, windows-11-arm]
        default: windows-latest

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUST_TOOLCHAIN: "1.99"

jobs:
  windows-arm64:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            # Not every runner image ships rustup: install it for the host architecture.
            $hostArch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "aarch64" } else { "x86_64" }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$hostArch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed" }
            $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
            $cargoBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$cargoBin;$env:PATH"
          }
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target aarch64-pc-windows-msvc
          rustup default $env:RUST_TOOLCHAIN
      - name: Build, sign (when the certificate secrets exist), MSI and zip
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Target aarch64-pc-windows-msvc -OutDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-aarch64
          path: dist/
          if-no-files-found: error
