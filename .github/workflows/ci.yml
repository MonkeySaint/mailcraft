# Continuous integration on GitHub Actions: `cargo xtask ci` (fmt, clippy, tests, layers, assets, licences,
# parity, wasm build) on a GitHub-hosted Ubuntu runner, inside a pinned Rust image.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: rust:1.99-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout (container user differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: System packages (egui/wgpu headless tests)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libgl1-mesa-dev mesa-vulkan-drivers
      - name: Toolchain components
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo (CARGO_HOME is /usr/local/cargo in the rust image)
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: cargo xtask ci
        run: cargo xtask ci
