# Release builds on GitHub Actions (GitHub-hosted runners). See docs/releasing.md for how to cut a release
# and the optional signing secrets.
#
# A pushed tag vX.Y.Z builds every package and publishes a GitHub release with them and SHA256SUMS.
# Run by hand (workflow_dispatch) it builds the same packages as run artifacts and publishes nothing.
#
# Jobs: version check, Linux x86_64 (ubuntu-latest) and aarch64 (ubuntu-24.04-arm) with tar.gz, deb, rpm and
# AppImage, Flatpak (x86_64), web, Windows MSI + zip (windows-latest), macOS universal DMG (macos-latest) and
# FreeBSD tar.gz + pkg (a FreeBSD VM on ubuntu-latest). A repository variable RELEASE_WINDOWS,
# RELEASE_MACOS or RELEASE_FREEBSD set to `false` skips that platform; skipped platforms do not hold the
# release back, failed ones do.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  # Toolchain for the jobs that do not run in the rust:1.99-bookworm image; keep the two in step.
  RUST_TOOLCHAIN: "1.99"

jobs:
  version-check:
    runs-on: ubuntu-latest
    container:
      image: rust:1.99-bookworm
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        # xtask reads the tag from GITHUB_REF (refs/tags/vX.Y.Z); not a tag: nothing to check.
        run: cargo xtask version check
      - name: Version
        id: version
        run: |
          v="$(cargo xtask version show)"
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "prerelease=$pre" >>"$GITHUB_OUTPUT"
          echo "MailCraft $v (prerelease: $pre)"

  linux:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    # Both architectures build natively, so ci-deps.sh installs no cross compiler.
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:1.99-bookworm
    env:
      MC_REQUIRE_NFPM: "1"
      MC_DOWNLOAD_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout (container user differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache cargo and packaging tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            ~/.cache/mailcraft-packaging
            target
          key: release-linux-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Packaging tools (apt, nfpm)
        run: |
          packaging/linux/ci-deps.sh "${{ matrix.target }}"
          rustup target add "${{ matrix.target }}"
      - name: Build, tar.gz, deb, rpm
        run: packaging/linux/package.sh --build --target "${{ matrix.target }}" --out dist
      - name: AppImage
        run: packaging/linux/appimage.sh --target "${{ matrix.target }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      # flatpak-builder sandboxes every build step with bubblewrap, which needs a privileged container.
      options: --privileged
    steps:
      - name: Tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates curl flatpak flatpak-builder
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist/linux
      - name: Cache Flatpak runtime
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-freedesktop-25.08
      - name: Flatpak bundle
        run: |
          tarball="$(ls dist/linux/mailcraft-*-linux-x86_64.tar.gz)"
          packaging/linux/flatpak/flatpak-bundle.sh --tarball "$tarball" --arch x86_64 --out dist/flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-x86_64
          path: dist/flatpak/
          if-no-files-found: error

  web:
    needs: version-check
    runs-on: ubuntu-latest
    container:
      image: rust:1.99-bookworm
    env:
      TRUNK_VERSION: "0.21.14"
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout (container user differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: release-web-${{ hashFiles('Cargo.lock') }}
      - name: Tools (zip, Trunk)
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends zip
          rustup target add wasm32-unknown-unknown
          # Trunk (MIT OR Apache-2.0) release binary; without it package.sh uses cargo + wasm-bindgen-cli.
          url="https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz"
          if curl -fsSL --retry 3 "$url" | tar -xz -C /usr/local/bin trunk; then
            trunk --version
          else
            echo "Trunk download failed; packaging/web/package.sh falls back to wasm-bindgen-cli"
          fi
      - name: Web build
        run: packaging/web/package.sh --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
          if-no-files-found: error

  windows:
    needs: version-check
    if: vars.RELEASE_WINDOWS != 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          rustup default $env:RUST_TOOLCHAIN
      - name: Build, sign (when the certificate secrets exist), MSI and zip
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Target x86_64-pc-windows-msvc -OutDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/
          if-no-files-found: error

  macos:
    needs: version-check
    if: vars.RELEASE_MACOS != 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
      - name: Universal app, sign and notarise (when the Apple secrets exist), DMG
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/package.sh --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/
          if-no-files-found: error

  freebsd:
    needs: version-check
    if: vars.RELEASE_FREEBSD != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, tar.gz and pkg (FreeBSD VM)
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          envs: "CARGO_TERM_COLOR CARGO_BUILD_JOBS CARGO_INCREMENTAL"
          prepare: |
            pkg install -y bash git rust
          run: |
            git config --global --add safe.directory "$PWD"
            bash packaging/freebsd/package.sh --build --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version-check, linux, flatpak, web, windows, macos, freebsd]
    # Tag pushes only; skipped platforms are fine, a failed one stops the release.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.version-check.result == 'success' && needs.linux.result == 'success'
      && needs.flatpak.result == 'success' && needs.web.result == 'success'
      && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Collect the packages and write SHA256SUMS
        run: |
          mkdir -p dist/release
          find dist/artifacts -type f -exec cp {} dist/release/ \;
          cd dist/release
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          range="$TAG"
          [ -n "$prev" ] && range="$prev..$TAG"
          {
            echo "MailCraft $VERSION."
            echo
            echo "Downloads: Linux (tar.gz, .deb, .rpm, AppImage, Flatpak), Windows (MSI, zip), macOS (DMG), FreeBSD (tar.gz, pkg) and web (zip). Check them against SHA256SUMS."
            echo
            echo "Changes${prev:+ since $prev}:"
            git log --no-merges --format='- %s' "$range"
          } >dist/notes.md
          cat dist/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version-check.outputs.version }}
          PRERELEASE: ${{ needs.version-check.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the files of the existing release.
            gh release upload "$TAG" dist/release/* --clobber
          else
            flags=(--verify-tag --title "MailCraft $VERSION" --notes-file dist/notes.md)
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" dist/release/*
          fi
