[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
description = "A clean-room, open-source desktop mail client modelled on the classic Outlook workflow"

[workspace.dependencies]
# internal
mailcraft-geom = { path = "crates/geom" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-model = { path = "crates/model" }
mailcraft-fonts = { path = "crates/fonts" }
mailcraft-store = { path = "crates/store" }
mailcraft-html = { path = "crates/html" }
mailcraft-layout = { path = "crates/layout" }
mailcraft-render = { path = "crates/render" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-ui-egui = { path = "crates/ui-egui" }
mailcraft-mcp = { path = "crates/mcp" }
mailcraft-proof = { path = "crates/proof" }
mailcraft-net = { path = "crates/net" }
mailcraft-formats = { path = "crates/formats" }
mailcraft-search = { path = "crates/search" }
mailcraft-smime = { path = "crates/smime" }
mailcraft-testmail = { path = "crates/testmail" }
mailcraft-web = { path = "apps/mailcraft-web" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
proptest = "1"
tempfile = "3"
base64 = "0.23"
encoding_rs = "0.8"
# Internationalised domain names (UTS #46 / IDNA2008 processing, Punycode RFC 3492; MIT OR Apache-2.0, data
# Unicode-3.0). Already in the tree through `url`.
idna = "1.1"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-width = "0.2"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "links"] }
egui_kittest = "0.36"
# Raster decoding (MIT OR Apache-2.0): PNG, JPEG (zune-jpeg) and GIF only, for contact pictures, pasted and
# inline pictures, and screenshots in tests.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rfd = "0.17"
# System clipboard HTML flavour and pictures for compose paste / copy (MIT OR Apache-2.0); already used by
# egui-winit. `image-data` reads clipboard pictures (adds the image crate and the platform graphics bindings,
# all MIT/Apache-2.0/Zlib).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Screen capture for Insert › Screenshot (apps/mailcraft only). Linux and the BSDs: the X11 window list and
# GetImage (x11rb, pure Rust, MIT OR Apache-2.0; already in the tree through winit) and the XDG desktop portal
# over D-Bus (zbus, MIT; already in the tree through keyring). Windows and macOS: xcap (Apache-2.0).
x11rb = "0.13"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
xcap = "0.9"

# web (wasm32 only; all MIT OR Apache-2.0)
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.103"
web-sys = "0.3.103"

# network: rustls with the ring provider only. Never enable rustls' default features: they pull in
# aws-lc-sys, whose licence carries OpenSSL terms that are not on the allowlist.
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.1"
ring = "0.17.14"
# OS credential store for account secrets (MIT OR Apache-2.0): Keychain on macOS, Credential Manager on Windows,
# the Secret Service (D-Bus, pure-Rust zbus) on Linux and the BSDs. The default `v1` feature picks the store.
keyring = "4.2.0"
# test servers: self-signed certificates (ring backend)
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

# S/MIME (RFC 8551) over CMS (RFC 5652) and X.509 (RFC 5280): pure-Rust RustCrypto crates, all
# MIT OR Apache-2.0. No OpenSSL and no C code, so the browser build keeps them.
der = { version = "0.7.10", features = ["alloc", "derive", "oid", "pem", "zeroize"] }
spki = { version = "0.7.3", features = ["alloc"] }
const-oid = { version = "0.9.6", features = ["db"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "pem"] }
cms = { version = "0.2.3", features = ["std"] }
pkcs8 = { version = "0.10.2", features = ["std", "encryption", "pem", "3des", "sha1-insecure"] }
pkcs5 = { version = "0.7.1", features = ["alloc", "pbes2", "3des", "sha1-insecure"] }
pkcs12 = { version = "0.1.0", features = ["kdf"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "pem", "u64_digit", "sha1", "sha2"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
des = "0.8.1"
rc2 = "0.8.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
getrandom = "0.2.17"
zeroize = "1.8"

# file formats: Compound File Binary container ([MS-CFB]) for .msg (MIT)
cfb = "0.14"
roxmltree = "0.20"
miniz_oxide = "0.8"

# SVG rasterising: xtask ico, the UI (app icon, SVG pictures) and mailcraft-render (generated pictures to PNG)
resvg = { version = "0.45.1", default-features = false }

# text / rendering
skrifa = "0.48"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
# PDF writer (print, Save as PDF): MIT OR Apache-2.0. No default features: we place glyphs ourselves (no
# rustybuzz) and print images as placeholders (no image decoders).
krilla = { version = "0.8.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
strip = "symbols"
