[package]
name = "mailcraft-ui-egui"
description = "MailCraft's desktop user interface on egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mailcraft-geom.workspace = true
mailcraft-model.workspace = true
mailcraft-mime.workspace = true
mailcraft-fonts.workspace = true
mailcraft-html.workspace = true
mailcraft-layout.workspace = true
mailcraft-engine.workspace = true
egui.workspace = true
egui_extras.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# SVG rasterising for the app icon (Apache-2.0 OR MIT; same version egui_extras' svg loader uses).
resvg.workspace = true
# PNG / JPEG / GIF decoding for contact pictures and pictures in message bodies (MIT OR Apache-2.0).
image.workspace = true
base64.workspace = true

# Downloading remote pictures in message bodies (native only: the browser build has no sockets or threads).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mailcraft-net.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }
mailcraft-testmail.workspace = true
mailcraft-smime = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
