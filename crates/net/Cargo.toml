# TLS: rustls with the ring provider (Apache-2.0 OR ISC OR MIT; ring is Apache-2.0 AND ISC); system roots from
# rustls-native-certs (Apache-2.0 OR ISC OR MIT). No webpki-roots (CDLA/MPL data).
rustls.workspace = true
rustls-native-certs.workspace = true
ring.workspace = true

[dev-dependencies]
proptest.workspace = true
mailcraft-testmail.workspace = true
# Self-signed certificates for scripted TLS servers in tests.
rcgen.workspace = true

