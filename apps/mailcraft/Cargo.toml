[package]
name = "mailcraft"
description = "MailCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mailcraft-engine.workspace = true
mailcraft-ui-egui.workspace = true
# Family names of installed fonts (the compose Font list).
mailcraft-fonts.workspace = true
eframe.workspace = true
log.workspace = true
# Native open/save/folder dialogs (MIT).
rfd.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# wgpu as a second renderer (MAILCRAFT_RENDERER=wgpu): Direct3D 12 on Windows, Vulkan or Metal elsewhere.
eframe = { workspace = true, features = ["wgpu"] }
# HTML and pictures on the system clipboard (rich paste into compose).
arboard.workspace = true
# Encodes clipboard pictures (RGBA) as PNG for the compose editor; decodes portal screenshots.
image.workspace = true

# Screen capture (Insert › Screenshot): X11 and the desktop portal.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb.workspace = true
zbus.workspace = true

# Screen capture (Insert › Screenshot).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
